<div class="card">
  <h3>Scenario Simulator</h3>
  <div class="sliders">
    <div class="slider-group">
      <label>
        News Pressure Index (NPI)
        <span [style.color]="npi() > 0.3 ? '#00c896' : npi() < -0.3 ? '#e24b4a' : '#f0a500'">
          {{ npi() | number:'1.2-2' }}
        </span>
      </label>
      <input
        type="range" min="-1" max="1" step="0.01"
        [value]="npi()"
        (input)="npi.set(+$any($event.target).value); recalculate()"
      />
      <div class="range-labels"><span>Bearish</span><span>Neutral</span><span>Bullish</span></div>
    </div>

    <div class="slider-group">
      <label>
        Model Confidence
        <span>{{ confidence() | number:'1.0-0' }}%</span>
      </label>
      <input
        type="range" min="0" max="1" step="0.01"
        [value]="confidence()"
        (input)="confidence.set(+$any($event.target).value); recalculate()"
      />
    </div>

    <div class="slider-group">
      <label>
        Volatility Regime
        <span>{{ volatility() | number:'1.2-2' }}</span>
      </label>
      <input
        type="range" min="0" max="1" step="0.01"
        [value]="volatility()"
        (input)="volatility.set(+$any($event.target).value); recalculate()"
      />
      <div class="range-labels"><span>Low</span><span>Medium</span><span>High</span></div>
    </div>
  </div>
</div>
