<div class="card decision-card" [style.border-color]="color()">
  <div class="decision-badge" [style.background]="color()">
    {{ api.signalData().decision }}
  </div>
  <div class="confidence">
    Confidence: <strong>{{ api.signalData().confidence }}</strong>
  </div>
  <p class="rationale">{{ api.signalData().rationale }}</p>
  <div class="meta">
    <span>NPI: {{ api.signalData().npi | number:'1.2-2' }}</span>
    <span>Model: {{ api.signalData().model }}</span>
  </div>
</div>
