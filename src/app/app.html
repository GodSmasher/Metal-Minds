<div class="grid-dashboard">
  <!-- Header -->
  <div class="header">
    <h1><span>S</span>ignal</h1>
    <select class="commodity-select" (change)="onCommodityChange($event)">
      @for (c of commodities; track c) {
        <option [value]="c" [selected]="c === api.commodity()">{{ c }}</option>
      }
    </select>
  </div>

  <!-- Row 1: Chart + Decision -->
  <app-price-chart></app-price-chart>
  <app-decision-card></app-decision-card>

  <!-- Row 2: News + Chat -->
  <app-news-feed></app-news-feed>
  <app-interrogation></app-interrogation>

  <!-- Row 3: Simulator full width -->
  <div class="span-full">
    <app-simulator></app-simulator>
  </div>
</div>
